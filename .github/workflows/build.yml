name: Build crates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - ink-core
          - ink-proto
          - ink-query
          - ink-client
          - ink-server
          - ink-browser

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: matrix.package == 'ink-browser'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libclang-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libssl-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build crate
        run: cargo build --locked --package ${{ matrix.package }}

  build-windows-browser:
    name: Build ink-browser (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Windows desktop app
        run: cargo build --locked --package ink-browser
